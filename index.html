<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pixel RPG Tycoon</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    
    <style>
        /* RESET I USTAWIENIA POD TELEFON */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none; /* Zapobiega zaznaczaniu tekstu */
            -webkit-tap-highlight-color: transparent; /* Usuwa niebieskie podświetlenie na Androidzie */
            font-family: 'Press Start 2P', monospace;
        }

        body {
            background-color: #000;
            color: #fff;
            overflow: hidden; /* Blokuje przewijanie ekranu */
        }

        /* GŁÓWNY KONTENER GRY */
        #game-container {
            width: 100vw;
            height: 100vh;
            background: url('background.png') no-repeat center center;
            background-size: cover;
            position: relative;
            display: flex;
            flex-direction: column;
        }

        /* EKRAN STARTOWY (LOGOWANIE) */
        #start-screen {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(20, 30, 20, 0.9);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        .panel {
            background: #5E3A21; /* Pikselowy brąz */
            border: 4px solid #3A2313;
            border-radius: 8px;
            padding: 20px;
            text-align: center;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.5), 0 5px 15px rgba(0,0,0,0.8);
        }

        input[type="text"] {
            width: 100%;
            padding: 10px;
            margin: 15px 0;
            background: #2C1A0E;
            border: 2px solid #8B5A2B;
            color: #fff;
            text-align: center;
            font-size: 12px;
            outline: none;
        }

        /* PRZYCISKI */
        .btn {
            background: #4CAF50; /* Zgniła zieleń z tła */
            border: 4px solid #2E7D32;
            color: white;
            padding: 15px;
            font-size: 10px;
            text-transform: uppercase;
            cursor: pointer;
            box-shadow: 0 4px 0 #1B5E20;
            border-radius: 4px;
            text-shadow: 2px 2px 0px #000;
        }

        .btn:active {
            transform: translateY(4px);
            box-shadow: 0 0 0 #1B5E20;
        }

        /* GÓRNY PASEK STATYSTYK */
        #top-bar {
            background: rgba(58, 35, 19, 0.9);
            border-bottom: 4px solid #2C1A0E;
            padding: 10px;
            display: none; /* Ukryte przed zalogowaniem */
            justify-content: space-between;
            font-size: 8px;
            line-height: 1.5;
            z-index: 10;
        }

        .player-info { color: #FFD700; }
        .resources { text-align: right; color: #E0E0E0; }

        /* INTERAKTYWNE STREFY NA TLE (LAB & DUNGEON) */
        .hitbox {
            position: absolute;
            background: rgba(0, 0, 0, 0.4); /* Lekko przyciemnione, potem zmienimy na przezroczyste */
            border: 2px dashed rgba(255, 255, 255, 0.5);
            display: none; /* Ukryte przed zalogowaniem */
            justify-content: center;
            align-items: center;
            text-align: center;
            font-size: 8px;
            color: white;
            text-shadow: 1px 1px 2px black;
            border-radius: 10px;
        }

        /* Ustawione pod grafikę, którą wysłałeś */
        #zone-lab {
            left: 5%;
            top: 40%;
            width: 40%;
            height: 25%;
        }

        #zone-dungeon {
            right: 5%;
            top: 45%;
            width: 40%;
            height: 25%;
        }

        /* DOLNE MENU */
        #bottom-nav {
            position: absolute;
            bottom: 0; left: 0; right: 0;
            background: #3A2313;
            border-top: 4px solid #2C1A0E;
            display: none;
            justify-content: space-around;
            padding: 10px 5px;
            z-index: 10;
        }

        .nav-btn {
            background: #8B5A2B;
            border: 3px solid #5E3A21;
            padding: 10px 5px;
            font-size: 7px;
            width: 23%;
        }
    </style>
</head>
<body>

<div id="game-container">
    
    <!-- EKRAN STARTOWY -->
    <div id="start-screen">
        <div class="panel">
            <h2 style="font-size: 16px; margin-bottom: 10px; color: #4CAF50;">Pixel RPG<br>Tycoon</h2>
            <p style="font-size: 8px; color: #aaa;">Enter your Nickname:</p>
            <input type="text" id="nickname-input" placeholder="Player123" maxlength="15">
            <button class="btn" onclick="startGame()">ENTER WORLD</button>
        </div>
    </div>

    <!-- GÓRNY PASEK -->
    <div id="top-bar">
        <div class="player-info">
            <span id="ui-nick">Name</span><br>
            <span id="ui-rank" style="color: #ff9800;">[PLAYER]</span><br>
            Weapon: <span id="ui-weapon" style="color: #fff;">None</span>
        </div>
        <div class="resources">
            🪵 Plank: <span id="res-plank">0</span><br>
            🪨 Stone: <span id="res-stone">0</span><br>
            🍖 Meat: <span id="res-meat">0</span>
        </div>
    </div>

    <!-- KLIKALNE STREFY NA BUDYNKACH -->
    <div id="zone-lab" class="hitbox" onclick="openLab()">
        ENTER<br>LABORATORY
    </div>
    
    <div id="zone-dungeon" class="hitbox" onclick="enterDungeon()">
        ENTER<br>DUNGEON<br>Lv. <span id="dungeon-lvl-display">1</span>
    </div>

    <!-- DOLNA NAWIGACJA -->
    <div id="bottom-nav">
        <button class="btn nav-btn" onclick="alert('Inventory otwarto!')">EQ</button>
        <button class="btn nav-btn" onclick="openLab()">LAB</button>
        <button class="btn nav-btn" onclick="enterDungeon()">DUNGEON</button>
        <button class="btn nav-btn" onclick="alert('Misje otwarto!')">QUESTS</button>
    </div>

</div>

<script src="script.js"></script>
</body>
</html>
